; 安装位置示例：/etc/supervisor/conf.d/kimi-monitor.conf
; 部分 RHEL 系发行版使用 /etc/supervisord.d/kimi-monitor.ini。
; 业务参数全部从 /etc/kimi-monitor/config.yaml 读取，不使用环境变量配置。

[program:kimi-monitor]
command=/opt/kimi-monitor/bin/kimi-monitor --config /etc/kimi-monitor/config.yaml run
directory=/opt/kimi-monitor
user=kimi-monitor
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=5

; Go 服务响应 SIGTERM，取消正在进行的 HTTP 请求后退出。
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; 统一写入应用日志，由 Supervisor 自动轮转。
redirect_stderr=true
stdout_logfile=/var/log/kimi-monitor/monitor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
umask=027
